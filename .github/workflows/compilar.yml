name: Compilar y publicar FacPro Vendedor

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Versión
        id: version
        run: |
          CODIGO=$((100 + ${{ github.run_number }}))
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "nombre=1.0.$CODIGO" >> "$GITHUB_OUTPUT"

      - name: Llave de firma
        env:
          LLAVE_B64: ${{ secrets.FACPRO_KEYSTORE_B64 }}
        run: |
          if [ -z "$LLAVE_B64" ]; then echo "Falta el secreto FACPRO_KEYSTORE_B64"; exit 1; fi
          echo "$LLAVE_B64" | base64 -d > "$RUNNER_TEMP/facpro.jks"
          echo "FACPRO_KEYSTORE=$RUNNER_TEMP/facpro.jks" >> "$GITHUB_ENV"

      - name: Compilar FacPro Vendedor
        env:
          FACPRO_KEYSTORE_PASSWORD: ${{ secrets.FACPRO_KEYSTORE_PASSWORD }}
          FACPRO_KEY_ALIAS: ${{ secrets.FACPRO_KEY_ALIAS }}
          FACPRO_KEY_PASSWORD: ${{ secrets.FACPRO_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PversionCode=${{ steps.version.outputs.codigo }} \
            -PversionName=${{ steps.version.outputs.nombre }}

      - name: Preparar archivos
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FacPro-Vendedor.apk
          printf '{"versionCode": %s, "versionName": "%s"}\n' \
            "${{ steps.version.outputs.codigo }}" "${{ steps.version.outputs.nombre }}" > dist/version.json
          ls -la dist

      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.nombre }}" dist/* \
            --title "FacPro Vendedor ${{ steps.version.outputs.nombre }}" \
            --notes "FacPro Vendedor (Monitoreo de Rutas y Choferes + Toma de Pedidos) para Android. La app instalada se actualiza sola al abrirse." \
            --latest
